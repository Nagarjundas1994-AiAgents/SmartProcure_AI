name: pr-check

# Runs on every PR: validates title/branch/description, labels the PR, and posts ONE sticky comment with
# the findings so the author sees what to fix before a human reviews. Rules live in .github/scripts/pr-check.cjs.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: pr-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rule self-test
        run: node --test ".github/scripts/*.test.cjs"
      - uses: actions/github-script@v7
        with:
          script: |
            const { evaluate, render } = require('./.github/scripts/pr-check.cjs');
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const r = evaluate({ title: pr.title, body: pr.body, head: pr.head.ref, base: pr.base.ref,
              files: files.map(f => ({ filename: f.filename, additions: f.additions, deletions: f.deletions, patch: f.patch })) });
            const md = render(r);
            await core.summary.addRaw(md).write();

            // Fork and Dependabot PRs get a read-only token: the summary above is then the only output.
            try {
              const mine = new Set(r.labels);
              for (const l of mine) await github.rest.issues.createLabel({ owner, repo, name: l }).catch(() => {});
              const stale = pr.labels.map(l => l.name).filter(n => /^(size: |workstream: |cross-workstream$|contract-change$)/.test(n) && !mine.has(n));
              for (const n of stale) await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: n }).catch(() => {});
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [...mine] });

              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
              const old = comments.find(c => c.body.startsWith('<!-- pr-check -->'));
              if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body: md });
              else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: md });
            } catch (e) {
              core.warning(`Could not comment/label (read-only token?): ${e.message}`);
            }
            if (!r.ok) core.setFailed(r.fail.join('\n'));
